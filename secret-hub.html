<!--
  Security fixes applied (see security-fixes.sql for the matching DB changes):
  - The hard-coded admin passcode is gone. Admin login is now a real
    Supabase Auth account (create it once in Dashboard → Authentication →
    Users → Add user), so no password is readable in this file's source.
  - After running security-fixes.sql, only this authenticated admin session
    can approve/reject/ban accounts or unbind devices — a regular visitor
    can no longer do it themselves via the browser console.
  - Auto-refresh polling slowed from every 1s to every 5s (realtime
    subscriptions already push live updates; this is just a safety net).
-->
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Hub - Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #0b090a;
      --card-bg: #161a1d;
      --accent-color: #e63946;
      --accent-gradient: linear-gradient(135deg, #d90429 0%, #ef233c 50%, #800020 100%);
      --glass-border: rgba(255,255,255,0.08);
      --text-main: #f8fafc;
      --text-muted: #b1a7a6;
      --success-color: #2a9d8f;
      --warning-color: #e9c46a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    #admin-login-box { background: var(--card-bg); border: 1px solid var(--glass-border); padding: 40px 25px; border-radius: 20px; text-align: center; max-width: 420px; margin: 80px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #admin-login-box h2 { color: var(--accent-color); margin-bottom: 8px; font-size: 1.8rem; }
    #admin-login-box p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 25px; }
    .input-wrap { background: var(--bg-main); border: 1px solid var(--glass-border); border-radius: 15px; padding: 12px 15px; margin-bottom: 15px; }
    .input-wrap input { width: 100%; background: transparent; border: none; color: #fff; outline: none; text-align: center; font-size: 1rem; }
    .btn { background: var(--accent-gradient); color: #fff; border: none; padding: 12px 25px; border-radius: 15px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; transition: transform 0.2s; }
    .btn:active { transform: scale(0.98); }
    #admin-panel { display: none; }
    .header-panel { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--glass-border); }
    .header-panel h2 { color: var(--accent-color); font-size: 1.6rem; display: flex; align-items: center; gap: 10px; }
    .exit-btn { background: transparent; border: 1px solid var(--glass-border); color: var(--text-muted); padding: 8px 16px; border-radius: 12px; cursor: pointer; transition: 0.3s; }
    .exit-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--glass-border); padding: 18px 20px; border-radius: 16px; display: flex; align-items: center; gap: 15px; }
    .stat-icon { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    .stat-icon.active-icon { background: rgba(42,157,143,0.15); color: var(--success-color); }
    .stat-icon.pending-icon { background: rgba(233,196,106,0.15); color: var(--warning-color); }
    .stat-icon.bound-icon { background: rgba(230,57,70,0.15); color: var(--accent-color); }
    .stat-info h3 { font-size: 1.4rem; color: #fff; }
    .stat-info p { font-size: 0.8rem; color: var(--text-muted); }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; background: var(--card-bg); border: 1px solid var(--glass-border); color: var(--text-muted); border-radius: 12px; cursor: pointer; font-weight: 600; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
    .tab-btn.active { background: var(--accent-gradient); color: #fff; border-color: transparent; box-shadow: 0 4px 15px rgba(217,4,41,0.3); }
    .request-card { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; }
    .request-info { flex: 1; min-width: 280px; }
    .request-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .request-info h4 { font-size: 1.15rem; color: #fff; }
    .badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 20px; font-weight: 700; text-transform: uppercase; }
    .badge-active { background: rgba(42,157,143,0.2); color: var(--success-color); border: 1px solid rgba(42,157,143,0.4); }
    .badge-pending { background: rgba(233,196,106,0.2); color: var(--warning-color); border: 1px solid rgba(233,196,106,0.4); }
    .badge-bound { background: rgba(230,57,70,0.2); color: #ff6b7a; border: 1px solid rgba(230,57,70,0.4); }
    .badge-unbound { background: rgba(255,255,255,0.06); color: var(--text-muted); border: 1px solid var(--glass-border); }
    .detail-row { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; color: var(--text-muted); margin-top: 8px; flex-wrap: wrap; }
    .detail-item { display: flex; align-items: center; gap: 6px; }
    .detail-item strong { color: #fff; }
    .duration-tag { background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); padding: 5px 10px; border-radius: 8px; color: #f1faee; font-weight: 500; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 6px; }
    .duration-tag.membership { border-color: rgba(69,123,157,0.4); color: #a8dadc; }
    .duration-tag.usage { border-color: rgba(230,57,70,0.4); color: #ffb703; }
    .duration-tag.device { border-color: rgba(155,89,182,0.4); color: #c39bd3; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .approve-btn { background: #2a9d8f; color: #fff; border: none; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
    .reject-btn { background: #e63946; color: #fff; border: none; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
    .unbind-btn { background: transparent; border: 1px solid rgba(155,89,182,0.5); color: #c39bd3; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
    .unbind-btn:hover { background: rgba(155,89,182,0.15); color: #fff; }
    .approve-btn:hover { background: #238579; }
    .reject-btn:hover { background: #d0303d; }
    .error-txt { color: #e63946; margin-bottom: 15px; font-size: 0.85rem; display: none; }
    #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
    .toast { background: #262d34; color: #fff; padding: 10px 18px; border-radius: 14px; font-size: 0.85rem; box-shadow: 0 10px 30px rgba(0,0,0,0.4); opacity: 0; transform: translateY(-10px); transition: opacity 0.25s, transform 0.25s; }
    .toast.show { opacity: 1; transform: none; }
    .toast.success { background: #14532d; }
    .toast.error { background: #7f1d1d; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(6px); z-index: 400; align-items: center; justify-content: center; padding: 16px; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 20px; width: 100%; max-width: 400px; padding: 25px; text-align: center; }
    .modal-content h3 { color: var(--accent-color); margin-bottom: 12px; font-size: 1.15rem; }
    .modal-content p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions button { flex: 1; padding: 11px; border-radius: 12px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; }
    .modal-cancel { background: transparent; border: 1px solid var(--glass-border) !important; color: var(--text-main); }
    .modal-confirm { background: var(--accent-gradient); color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <div id="admin-login-box">
      <i class="fa-solid fa-user-shield" style="font-size: 3.5rem; color: var(--accent-color); margin-bottom: 15px;"></i>
      <h2>Secret Hub</h2>
      <p>Sign in with your admin account to access the Control Panel</p>
      <div class="error-txt" id="login-error">Incorrect email or password.</div>
      <div class="input-wrap">
        <input type="email" id="admin-email-input" placeholder="Admin email..." autocomplete="username" onkeypress="if(event.key==='Enter') checkAdminLogin()">
      </div>
      <div class="input-wrap">
        <input type="password" id="admin-pass-input" placeholder="Admin password..." autocomplete="current-password" onkeypress="if(event.key==='Enter') checkAdminLogin()">
      </div>
      <button class="btn" id="admin-login-btn" onclick="checkAdminLogin()">Access Dashboard</button>
    </div>

    <div id="admin-panel">
      <div class="header-panel">
        <h2><i class="fa-solid fa-shield-halved"></i> Secret Hub Dashboard</h2>
        <button class="exit-btn" onclick="logoutAdmin()"><i class="fa-solid fa-right-from-bracket"></i> Exit</button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon active-icon"><i class="fa-solid fa-user-check"></i></div>
          <div class="stat-info">
            <h3 id="stat-active-count">0</h3>
            <p>Active Accounts</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon pending-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
          <div class="stat-info">
            <h3 id="stat-pending-count">0</h3>
            <p>Pending Requests</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon bound-icon"><i class="fa-solid fa-mobile-screen-button"></i></div>
          <div class="stat-info">
            <h3 id="stat-bound-count">0</h3>
            <p>Device-Bound Accounts</p>
          </div>
        </div>
      </div>

      <div class="tabs">
        <div class="tab-btn active" id="tab-approved" onclick="switchTab('approved')">
          <i class="fa-solid fa-users"></i> Active Accounts
        </div>
        <div class="tab-btn" id="tab-pending" onclick="switchTab('pending')">
          <i class="fa-solid fa-user-clock"></i> Pending Requests
        </div>
      </div>

      <div id="requests-container">
        <p style="text-align: center; color: var(--text-muted); padding: 30px;">Loading data...</p>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <div id="confirm-modal" class="modal">
    <div class="modal-content">
      <h3 id="confirm-title">Confirm</h3>
      <p id="confirm-text">Are you sure?</p>
      <div class="modal-actions">
        <button class="modal-cancel" onclick="closeConfirm(false)">Cancel</button>
        <button class="modal-confirm" onclick="closeConfirm(true)">Confirm</button>
      </div>
    </div>
  </div>
  <script>
    const SUPABASE_URL = 'https://aafnptpedklibvvytrdv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhZm5wdHBlZGtsaWJ2dnl0cmR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3OTk2NzQsImV4cCI6MjEwMjM3NTY3NH0.QuA-7sUFSF7z8tuQaccGI7Oo4jx8WjWoH6m1z9Ga9HQ';

    let _supabase = null;
    function getSupabase() {
      if (!_supabase && window.supabase) {
        _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      return _supabase;
    }

    // Admin access is now a real Supabase Auth account instead of a
    // passcode baked into this file. One-time setup required:
    //   1. Supabase Dashboard → Authentication → Users → Add user
    //      (create the admin's email + password there).
    //   2. Run the RLS SQL script so that only rows created by that
    //      authenticated user can approve/reject/unbind accounts.
    // Anyone who opens "view source" on this page can no longer see a
    // password that grants access — the password lives only in Supabase Auth.
    // Only this email is allowed into the dashboard. RLS in the database
    // enforces this for real (see security-fixes.sql); this check just
    // gives an immediate, clear "Access Denied" instead of a blank/broken
    // panel if someone signs in with a different account.
    const ALLOWED_ADMIN_EMAIL = 'mazenramy985@gmail.com';

    let currentTab = 'approved';
    let autoRefreshTimer = null;

    function showPanel() {
      document.getElementById('admin-login-box').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
      loadStats();
      loadData();
      initRealtime();
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      // Realtime handles live updates; this is just a safety-net poll.
      autoRefreshTimer = setInterval(() => {
        if (document.getElementById('admin-panel').style.display === 'block') loadData(false);
      }, 5000);
    }

    async function checkAdminLogin() {
      const c = getSupabase(); if (!c) return;
      const email = document.getElementById('admin-email-input').value.trim();
      const pass = document.getElementById('admin-pass-input').value;
      const btn = document.getElementById('admin-login-btn');
      const errBox = document.getElementById('login-error');
      errBox.style.display = 'none';
      if (!email || !pass) { errBox.textContent = 'Enter email and password.'; errBox.style.display = 'block'; return; }
      btn.disabled = true; btn.style.opacity = '.7';
      const { data, error } = await c.auth.signInWithPassword({ email, password: pass });
      if (error) {
        btn.disabled = false; btn.style.opacity = '1';
        errBox.textContent = error.message || 'Incorrect email or password.';
        errBox.style.display = 'block';
        return;
      }
      if ((data?.user?.email || '').toLowerCase() !== ALLOWED_ADMIN_EMAIL.toLowerCase()) {
        await c.auth.signOut();
        btn.disabled = false; btn.style.opacity = '1';
        errBox.textContent = 'Access Denied.';
        errBox.style.display = 'block';
        return;
      }
      btn.disabled = false; btn.style.opacity = '1';
      showPanel();
    }

    async function logoutAdmin() {
      const c = getSupabase();
      if (c) { try { await c.auth.signOut(); } catch(e){} }
      document.getElementById('admin-login-box').style.display = 'block';
      document.getElementById('admin-panel').style.display = 'none';
      document.getElementById('admin-pass-input').value = '';
      document.getElementById('login-error').style.display = 'none';
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    }

    // If a session is already active (e.g. page refresh), skip straight to
    // the panel — but only if it's the allowed admin's session.
    (async () => {
      const c = getSupabase(); if (!c) return;
      const { data } = await c.auth.getSession();
      const email = data?.session?.user?.email || '';
      if (data?.session && email.toLowerCase() === ALLOWED_ADMIN_EMAIL.toLowerCase()) {
        showPanel();
      } else if (data?.session) {
        await c.auth.signOut();
        document.getElementById('login-error').textContent = 'Access Denied.';
        document.getElementById('login-error').style.display = 'block';
      }
    })();

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-approved').className = 'tab-btn ' + (tab === 'approved' ? 'active' : '');
      document.getElementById('tab-pending').className = 'tab-btn ' + (tab === 'pending' ? 'active' : '');
      loadData();
    }

    function getMembershipTime(d) {
      if (!d) return '0s';
      const diff = Math.max(0, Date.now() - new Date(d).getTime());
      return formatSeconds(Math.floor(diff / 1000));
    }

    function formatSeconds(s) {
      if (!s || isNaN(s)) return '0s';
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      let p = [];
      if (d > 0) p.push(d + 'd');
      if (h > 0 || d > 0) p.push(h + 'h');
      if (m > 0 || h > 0 || d > 0) p.push(m + 'm');
      p.push(sec + 's');
      return p.join(' ');
    }

    function escapeHtml(t) {
      return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function shortenFp(fp) {
      if (!fp || fp.length < 12) return fp || '';
      return fp.slice(0, 6) + '...' + fp.slice(-4);
    }

    async function loadStats() {
      const c = getSupabase(); if (!c) return;
      const { data } = await c.from('account_requests').select('status,device_fingerprint');
      if (data) {
        document.getElementById('stat-active-count').innerText = data.filter(d => d.status === 'approved').length;
        document.getElementById('stat-pending-count').innerText = data.filter(d => d.status === 'pending').length;
        document.getElementById('stat-bound-count').innerText = data.filter(d => d.device_fingerprint && d.device_fingerprint.length > 0).length;
      }
    }

    async function loadData(showLoading) {
      if (showLoading === undefined) showLoading = true;
      const c = getSupabase();
      const container = document.getElementById('requests-container');
      if (!c) {
        if (showLoading) container.innerHTML = '<p style="text-align:center;color:#e63946;padding:30px;">Connecting...</p>';
        setTimeout(() => loadData(showLoading), 1000);
        return;
      }
      if (showLoading) container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:30px;">Loading...</p>';
      const { data, error } = await c.from('account_requests').select('*').eq('status', currentTab).order('id', { ascending: false });
      if (error) { container.innerHTML = '<p style="text-align:center;color:#e63946;padding:30px;">Error: ' + escapeHtml(error.message) + '</p>'; return; }
      if (!data || !data.length) {
        const label = currentTab === 'approved' ? 'active accounts' : 'pending requests';
        container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:30px;">No ' + label + ' found.</p>';
        return;
      }
      container.innerHTML = '';
      data.forEach(req => {
        const card = document.createElement('div');
        card.className = 'request-card';
        const membershipStr = getMembershipTime(req.created_at);
        const usageStr = formatSeconds(req.usage_seconds || 0);
        const isBound = !!(req.device_fingerprint && req.device_fingerprint.length > 0);
        let actionButtons = '';
        if (currentTab === 'pending') {
          actionButtons = '<button class="approve-btn" onclick="updateStatus(' + req.id + ',\'approved\')"><i class="fa-solid fa-check"></i> Approve</button>' +
                          '<button class="reject-btn" onclick="updateStatus(' + req.id + ',\'rejected\')"><i class="fa-solid fa-ban"></i> Reject</button>';
        } else {
          actionButtons = '<button class="reject-btn" onclick="updateStatus(' + req.id + ',\'rejected\')"><i class="fa-solid fa-ban"></i> Ban</button>';
          if (isBound) actionButtons += '<button class="unbind-btn" onclick="unbindDevice(' + req.id + ',\'' + escapeHtml(req.username) + '\')"><i class="fa-solid fa-link-slash"></i> Unbind Device</button>';
        }
        const statusBadge = currentTab === 'approved'
          ? '<span class="badge badge-active">Active</span>'
          : '<span class="badge badge-pending">Pending</span>';
        const deviceBadge = isBound
          ? '<span class="badge badge-bound"><i class="fa-solid fa-lock" style="font-size:0.55rem;"></i> Device Bound</span>'
          : '<span class="badge badge-unbound"><i class="fa-solid fa-lock-open" style="font-size:0.55rem;"></i> Not Bound</span>';
        const deviceRow = isBound
          ? '<div class="detail-row"><div class="detail-item"><span class="duration-tag device" title="' + escapeHtml(req.device_fingerprint) + '"><i class="fa-solid fa-mobile-screen-button"></i> FP: ' + escapeHtml(shortenFp(req.device_fingerprint)) + '</span></div><div class="detail-item"><span class="duration-tag device"><i class="fa-solid fa-repeat"></i> Count: ' + (req.device_bind_count || 0) + '</span></div></div>'
          : '';
        card.innerHTML =
          '<div class="request-info">' +
            '<div class="request-header"><h4>' + escapeHtml(req.username) + '</h4>' + statusBadge + deviceBadge + '</div>' +
            '<div class="detail-row"><div class="detail-item"><i class="fa-solid fa-user"></i> User: <strong>' + escapeHtml(req.username) + '</strong></div>' +
            '<div class="detail-item"><i class="fa-solid fa-key"></i> Pass: <strong>' + escapeHtml(req.password) + '</strong></div></div>' +
            '<div class="detail-row">' +
              '<div class="detail-item"><span class="duration-tag membership"><i class="fa-solid fa-id-card"></i> Membership: ' + membershipStr + '</span></div>' +
              '<div class="detail-item"><span class="duration-tag usage"><i class="fa-solid fa-stopwatch"></i> Usage: ' + usageStr + '</span></div>' +
            '</div>' + deviceRow +
          '</div>' +
          '<div class="actions">' + actionButtons + '</div>';
        container.appendChild(card);
      });
    }

    async function updateStatus(id, newStatus) {
      const c = getSupabase(); if (!c) return;
      const { error } = await c.from('account_requests').update({ status: newStatus }).eq('id', id);
      if (error) showToast('Error: ' + error.message, 'error');
      else {
        showToast(newStatus === 'approved' ? 'Account approved' : 'Account rejected', newStatus === 'approved' ? 'success' : 'error');
        loadStats(); loadData();
      }
    }

    let _confirmResolve = null;
    function confirmModal(title, text) {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-text').textContent = text;
      document.getElementById('confirm-modal').style.display = 'flex';
      return new Promise(res => { _confirmResolve = res; });
    }
    function closeConfirm(v) {
      document.getElementById('confirm-modal').style.display = 'none';
      if (_confirmResolve) { const r = _confirmResolve; _confirmResolve = null; r(v); }
    }

    async function unbindDevice(id, username) {
      const ok = await confirmModal('Unbind Device?', 'This will free account "' + username + '" from its current device. The next device that logs in twice in a row will become the new bound device.');
      if (!ok) return;
      const c = getSupabase(); if (!c) return;
      const { error } = await c.from('account_requests').update({
        device_fingerprint: null,
        device_last_seen_fp: null,
        device_bind_count: 0
      }).eq('id', id);
      if (error) showToast('Error: ' + error.message, 'error');
      else {
        showToast('Device unbound from "' + username + '"', 'success');
        loadStats(); loadData(false);
      }
    }

    function showToast(msg, type) {
      const c = document.getElementById('toast-container');
      const d = document.createElement('div');
      d.className = 'toast ' + (type || 'info');
      d.textContent = msg;
      c.appendChild(d);
      requestAnimationFrame(() => d.classList.add('show'));
      setTimeout(() => { d.classList.remove('show'); setTimeout(() => d.remove(), 320); }, 2600);
    }

    function initRealtime() {
      const c = getSupabase(); if (!c) return;
      c.channel('admin_realtime_changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'account_requests' }, () => {
          loadStats(); loadData(false);
        })
        .subscribe();
    }
  </script>
</body>
</html>
